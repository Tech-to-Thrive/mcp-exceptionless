name: Test

on: [push, pull_request]

jobs:
  test:
    # Public repo: org runner group "Default" sets allows_public_repositories=false,
    # so self-hosted jobs here are permanently blocked. Must stay GitHub-hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint || true
      - run: npm run build
