name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    # Public repo: org runner group "Default" sets allows_public_repositories=false,
    # so self-hosted jobs here are permanently blocked. Must stay GitHub-hosted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
